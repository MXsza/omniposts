name: Omniposts 1080p Cloud Video Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Supabase render_jobs UUID"
        required: true
        type: string

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache FFmpeg, Python Packages & Arabic Font
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.cache/pip
            ~/.local/share/fonts
          key: omniposts-worker-v3-${{ runner.os }}

      - name: Fast Setup Static FFmpeg & Arabic Font (~5s, No apt-get)
        run: |
          mkdir -p ~/.local/bin ~/.local/share/fonts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [ ! -x ~/.local/bin/ffmpeg ] || [ ! -x ~/.local/bin/ffprobe ]; then
            curl -fsSL --max-time 60 -o /tmp/ffmpeg.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            tar -xf /tmp/ffmpeg.tar.xz --strip-components=2 -C ~/.local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            chmod +x ~/.local/bin/ffmpeg ~/.local/bin/ffprobe
            rm -f /tmp/ffmpeg.tar.xz
          fi
          if [ ! -f ~/.local/share/fonts/NotoSansArabic-Bold.ttf ]; then
            curl -fsSL --max-time 20 -o ~/.local/share/fonts/NotoSansArabic-Bold.ttf \
              "https://raw.githubusercontent.com/notofonts/arabic/main/fonts/NotoSansArabic/full/ttf/NotoSansArabic-Bold.ttf" \
              || true
          fi
          fc-cache -f ~/.local/share/fonts || true
          ~/.local/bin/ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          pip install --quiet requests edge-tts Pillow arabic-reshaper python-bidi

      - name: Run 1080p Video Render & YouTube Publisher
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python3 scripts/render_video.py
